[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbridge-ai"
version = "0.1.0"
description = "Discover and safely invoke application capabilities through portable manifests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SkillBridge contributors"}]
keywords = ["agents", "skills", "discovery", "cli", "interop"]

[project.scripts]
skillbridge = "skillbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
