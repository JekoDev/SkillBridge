[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillbridge-ai"
version = "0.8.0"
description = "Discover and safely invoke application capabilities through portable manifests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SkillBridge contributors"}]
keywords = ["agents", "skills", "discovery", "cli", "interop"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
skillbridge = "skillbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]